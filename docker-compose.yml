services:
  db:
    image: postgres:16-alpine
    container_name: undefined-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undefined_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undefined_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-undefined_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-undefined_user} -d ${POSTGRES_DB:-undefined_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
