services:
  db:
    image: postgres:16-alpine
    container_name: undefined-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undefined_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undefined_pass}
      POSTGRES_DB: ${POSTGRES_DB:-undefined_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-undefined_user} -d ${POSTGRES_DB:-undefined_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: undefined-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-undefined_user}:${POSTGRES_PASSWORD:-undefined_pass}@db:5432/${POSTGRES_DB:-undefined_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: undefined-web
    restart: unless-stopped
    env_file:
      - path: ./web/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
